# Runs every test on GitHub for each pull request and each change to main.
# A red ✗ on the pull request means something broke — do not merge until it is green.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache apt package downloads and indexes
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt
          key: ${{ runner.os }}-ubuntu-apt-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-apt-
      - name: Verify private Drive folder regression
        run: node tests/step4.test.js
      - name: Verify face proxy regression
        run: node tests/step5.test.js
      - name: Verify guest photo approval regression
        run: node tests/step10.test.js
      - name: Verify approved album privacy regression
        run: node tests/step50.test.js
      - name: Tools used by the tests (ffmpeg, Python imaging)
        run: |
          mkdir -p ~/.cache/apt/archives/partial ~/.cache/apt/lists/partial
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt/archives" -o Dir::State::lists="$HOME/.cache/apt/lists" update
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt/archives" -o Dir::State::lists="$HOME/.cache/apt/lists" install -y ffmpeg python3-pil
      - name: Install test browser
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run story browser test in isolation
        run: timeout 180s node tests/e2e_story.js
      - name: Run all tests
        run: npm test
