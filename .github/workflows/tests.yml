# Runs every test on GitHub for each pull request and each change to main.
# A red ✗ on the pull request means something broke — do not merge until it is green.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools used by the tests (ffmpeg, Python imaging)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil
      - name: Install test browser
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run all tests
        run: npm test
