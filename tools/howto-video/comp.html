<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// How-to video compositor: draws one frame at time t (seconds). Real app screens inside a phone, an arrow that points
// to what to tap, a tap ripple, gentle zooms, a caption on top.
const W = 540, H = 960, X = document.getElementById('c').getContext('2d'); X.scale(2, 2);
const Y = '#FAE900', SW = 390, SH = 844;
let IM = {}, T = {}, SC = [];
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
function load(names) { return Promise.all(names.map(n => new Promise(r => { const i = new Image(); i.onload = () => { IM[n] = i; r(); }; i.onerror = () => r(); i.src = 'shots/' + n + '.png'; }))); }
const logo = new Image(); logo.src = 'logo.png';
// phone placement
const PH = 742, K = PH / SH, PW = SW * K, P0 = { x: (W - PW) / 2, y: 176 };
function cam(t) {   // zoom: {t0,t1,(fx,fy) in screen px, s}
  let s = 1, fx = SW / 2, fy = SH / 2;
  for (const sc of SC) for (const z of (sc.zoom || [])) {
    const k = ease(clamp((t - z.t0) / .7, 0, 1)) * (1 - ease(clamp((t - z.t1) / .6, 0, 1)));
    if (k > 0) { s = lerp(1, z.s, k); fx = lerp(SW / 2, z.fx, k); fy = lerp(SH / 2, z.fy, k); }
  }
  return { s, fx, fy };
}
function toOut(c, px, py) {   // a point on the app screen -> canvas point (the camera zooms around the focus point)
  const bx = P0.x + px * K, by = P0.y + py * K, cx = P0.x + c.fx * K, cy = P0.y + c.fy * K;
  return [cx + (bx - cx) * c.s, cy + (by - cy) * c.s];
}
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function frameAt(sc, t) {
  const lt = t - sc.t0;
  for (const p of sc.parts) { if (lt >= p.at && lt < p.at + (p.d || 99)) {
    if (p.seq) { const n = p.n, i = Math.floor((lt - p.at) * p.fps); return p.seq + '-' + String(p.loop ? (i % n) : Math.min(n - 1, i)).padStart(3, '0'); }
    return p.img; } }
  return null;
}
function arrowTo(x, y, k, from) {   // a hand-drawn yellow arrow that draws itself toward (x,y)
  if (k <= 0) return;
  const [fx, fy] = from, mx = (fx + x) / 2 + (fy < y ? 40 : -40), my = (fy + y) / 2;
  const pts = []; for (let i = 0; i <= 40; i++) { const u = i / 40, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u; pts.push([a * fx + b * mx + c * x, a * fy + b * my + c * y]); }
  const m = Math.max(1, Math.floor(pts.length * clamp(k, 0, 1)));
  X.save(); X.strokeStyle = Y; X.lineWidth = 5; X.lineCap = 'round'; X.lineJoin = 'round'; X.shadowColor = 'rgba(0,0,0,.55)'; X.shadowBlur = 10;
  X.beginPath(); pts.slice(0, m).forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.stroke();
  if (m > 3) { const [ax, ay] = pts[m - 1], [bx, by] = pts[m - 4], ang = Math.atan2(ay - by, ax - bx);
    X.beginPath(); X.moveTo(ax, ay); X.lineTo(ax - 16 * Math.cos(ang - .5), ay - 16 * Math.sin(ang - .5)); X.moveTo(ax, ay); X.lineTo(ax - 16 * Math.cos(ang + .5), ay - 16 * Math.sin(ang + .5)); X.stroke(); }
  X.restore();
}
function ripple(x, y, k) {
  if (k < 0 || k > 1) return;
  X.save();
  X.globalAlpha = 1 - k; X.strokeStyle = Y; X.lineWidth = 4; X.beginPath(); X.arc(x, y, 12 + 40 * ease(k), 0, Math.PI * 2); X.stroke();
  X.globalAlpha = clamp(1 - k * 1.3, 0, 1) * .85; X.fillStyle = Y; X.beginPath(); X.arc(x, y, 13 * (1 - k * .4), 0, Math.PI * 2); X.fill();
  X.restore();
}
function caption(t) {
  let cur = null; for (const sc of SC) for (const c of (sc.cap || [])) if (t >= c.t0 && t < c.t1) cur = c;
  if (!cur) return;
  const a = clamp((t - cur.t0) / .3, 0, 1) * clamp((cur.t1 - t) / .25, 0, 1), dy = (1 - ease(clamp((t - cur.t0) / .35, 0, 1))) * 14;
  X.save(); X.globalAlpha = a; X.textAlign = 'center'; X.fillStyle = '#fff';
  X.font = '800 30px Manrope'; X.fillText(cur.text, W / 2, 84 + dy);
  if (cur.chip) { X.font = '700 19px Manrope'; const w = X.measureText(cur.chip).width + 34; rr(W / 2 - w / 2, 106 + dy, w, 38, 19); X.fillStyle = Y; X.fill(); X.fillStyle = '#111'; X.fillText(cur.chip, W / 2, 131 + dy); }
  X.restore();
}
function draw(t) {
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  // soft yellow glow behind the phone
  const gr = X.createRadialGradient(W / 2, 560, 40, W / 2, 560, 420); gr.addColorStop(0, 'rgba(250,233,0,.10)'); gr.addColorStop(1, 'rgba(250,233,0,0)'); X.fillStyle = gr; X.fillRect(0, 0, W, H);
  const sc = SC.find(s => t >= s.t0 && t < s.t1);
  if (!sc) return;
  if (sc.card) return sc.card(t - sc.t0);
  const c = cam(t), name = frameAt(sc, t), img = IM[name];
  // press: the phone dips a little on each tap
  let press = 0; (sc.taps || []).forEach(tp => { const k = (t - tp.t) / .25; if (k >= 0 && k <= 1) press = Math.sin(Math.PI * k) * .012; });
  // scene in: slide up + fade
  const kin = ease(clamp((t - sc.t0) / .45, 0, 1));
  X.save();
  X.beginPath(); X.rect(0, 158, W, H - 158); X.clip();
  X.globalAlpha = sc.fadeIn === false ? 1 : kin;
  const [x0, y0] = toOut(c, 0, 0), [x1, y1] = toOut(c, SW, SH);
  const cxp = (x0 + x1) / 2, cyp = (y0 + y1) / 2;
  X.translate(cxp, cyp + (sc.fadeIn === false ? 0 : (1 - kin) * 30)); X.scale(1 - press, 1 - press); X.translate(-cxp, -cyp);
  // bezel
  X.save(); X.shadowColor = 'rgba(0,0,0,.6)'; X.shadowBlur = 30; rr(x0 - 7 * c.s, y0 - 7 * c.s, x1 - x0 + 14 * c.s, y1 - y0 + 14 * c.s, 40 * c.s); X.fillStyle = '#1c1c1e'; X.fill(); X.restore();
  rr(x0 - 7 * c.s, y0 - 7 * c.s, x1 - x0 + 14 * c.s, y1 - y0 + 14 * c.s, 40 * c.s); X.strokeStyle = '#3a3a3c'; X.lineWidth = 1.5; X.stroke();
  X.save(); rr(x0, y0, x1 - x0, y1 - y0, 33 * c.s); X.clip(); if (img) X.drawImage(img, x0, y0, x1 - x0, y1 - y0); else { X.fillStyle = '#222'; X.fillRect(x0, y0, x1 - x0, y1 - y0); } X.restore();
  // swipe hint: a finger dot moving up
  (sc.swipes || []).forEach(sw => { const k = (t - sw.t) / .7; if (k < 0 || k > 1) return; const [sx, sy] = toOut(c, SW / 2, 640 - 380 * ease(k)); X.save(); X.globalAlpha = Math.sin(Math.PI * k); X.fillStyle = Y; X.beginPath(); X.arc(sx, sy, 16, 0, 7); X.fill(); X.globalAlpha *= .4; X.fillRect(sx - 4, sy, 8, 120 * ease(k)); X.restore(); });
  X.restore();
  // arrows and taps (outside the phone clip, on top)
  (sc.taps || []).forEach(tp => {
    const r = T[tp.target] || tp.box; if (!r) return;
    const px = r.x + r.w / 2 + (tp.dx || 0), py = r.y + r.h / 2 + (tp.dy || 0), [ox, oy] = toOut(c, px, py);
    const ka = (t - (tp.t - .75)) / .5, kf = clamp((tp.t + .5 - t) / .3, 0, 1);
    const from = tp.from || [ox + (ox > W / 2 ? -110 : 110), oy + (oy > 600 ? -150 : 150)];
    const off = 26, ang = Math.atan2(oy - from[1], ox - from[0]);
    if (t > tp.t - .75 && t < tp.t + .5) { X.save(); X.globalAlpha = kf; arrowTo(ox - off * Math.cos(ang), oy - off * Math.sin(ang), ka, from); X.restore(); }
    ripple(ox, oy, (t - tp.t) / .6);
  });
  caption(t);
}
window.setup = async (scenes, targets, names) => { T = targets; await load(names); await document.fonts.load('800 30px Manrope'); await document.fonts.load('700 19px Manrope');
  SC = scenes.map(s => Object.assign({}, s)); SC.forEach(s => { if (s.cardKind) s.card = CARDS[s.cardKind]; }); return Object.keys(IM).length; };
window.draw = draw;
const CARDS = {
  intro(lt) { const a = ease(clamp(lt / .5, 0, 1)) * clamp((1.6 - lt) / .3, 0, 1);
    X.save(); X.globalAlpha = a; X.textAlign = 'center'; if (logo.complete) X.drawImage(logo, W / 2 - 53, 340 - (1 - a) * 10, 106, 80);
    X.fillStyle = '#fff'; X.font = '800 40px Manrope'; X.fillText('Make a reel', W / 2, 500); X.fillStyle = Y; X.fillText('in seconds', W / 2, 548);
    X.fillStyle = 'rgba(255,255,255,.65)'; X.font = '500 18px Manrope'; X.fillText('Reel Edits · PicGrades', W / 2, 596); X.restore(); },
  end(lt) { const a = ease(clamp(lt / .6, 0, 1));
    X.save(); X.globalAlpha = a; X.textAlign = 'center'; if (logo.complete) X.drawImage(logo, W / 2 - 66, 300, 132, 100);
    X.fillStyle = '#fff'; X.font = '800 36px Manrope'; X.fillText('Your wedding,', W / 2, 480); X.fillText('in your own app', W / 2, 524);
    const w = 220; rr(W / 2 - w / 2, 572, w, 52, 26); X.fillStyle = Y; X.fill(); X.fillStyle = '#111'; X.font = '800 20px Manrope'; X.fillText('picgrades.in', W / 2, 605); X.restore(); }
};
</script></body></html>
